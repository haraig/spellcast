name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Security problems go to a private report instead, see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select a sentence in Notepad
        2. Press CapsLock + 1
        3. Click Replace
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: input
    id: source-app
    attributes:
      label: App the text came from
      placeholder: Outlook, Chrome, VS Code, Windows Terminal, ...

  - type: input
    id: version
    attributes:
      label: Spellcast version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        Tray menu, Open log. Paste the lines around the problem. The log never contains your selected text, the answer or the API key, so it is safe to share.
      render: text
